name: docs

on:
  push:
    branches: ['master']
    tags: ['v*']
    paths-ignore: ['**.md','**.svg']
  pull_request:
    branches: ['master']
    paths-ignore: ['**.md','**.svg']
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}--docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare
        id: prep
        env:
          RECORDR_BRANCH: ${{ github.ref_name }}--docs
        run: |
          printf 'recordr_branch=%s\n' "$RECORDR_BRANCH" >>"$GITHUB_OUTPUT"
          printf 'recordr_build_dir=%s\n' build/rec >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: ● REC
        if: github.event_name != 'pull_request'
        id: recordr
        uses: ./
        with:
          branch: ${{ steps.prep.outputs.recordr_branch }}
          build-dir: ${{ steps.prep.outputs.recordr_build_dir }}

      - name: Upload ● REC artifacts
        uses: actions/upload-artifact@v7.0.2
        if: (success() || failure()) && github.event_name != 'pull_request'
        id: recordr-artifacts
        with:
          name: rec-artifacts
          if-no-files-found: error
          path: ${{ steps.prep.outputs.recordr_build_dir }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8.1.1
        if: startsWith(github.ref, 'refs/heads/')
        with:
          commit-message: |
            ${{ github.workflow }}(docs): update ${{ steps.recordr.outputs.file-list }}
          title: |
            ${{ github.workflow }}(docs): update ${{ steps.recordr.outputs.file-list }}
          body: |
            Updates ${{ steps.recordr.outputs.file-list }}
            ${{ steps.recordr.outputs.markdown }}
          labels: recordr,docs,rec
          branch: ${{ steps.prep.outputs.recordr_branch }}
